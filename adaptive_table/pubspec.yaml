name: adaptive_table
description: "A new Flutter package project."
version: 0.0.1
homepage:

environment:
  sdk: ^3.11.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  flutter_svg: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:

  assets:
    - assets/svg/

  fonts:
    - family: Afacad
      fonts:
        - asset: assets/fonts/Afacad-Thin.ttf
          weight: 100
        - asset: assets/fonts/Afacad-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Afacad-Light.ttf
          weight: 300
        - asset: assets/fonts/Afacad-Regular.ttf
          weight: 400
        - asset: assets/fonts/Afacad-Medium.ttf
          weight: 500
        - asset: assets/fonts/Afacad-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Afacad-Bold.ttf
          weight: 700
        - asset: assets/fonts/Afacad-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Afacad-Black.ttf
          weight: 900
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Unbounded-Light.ttf
          weight: 300
        - asset: assets/fonts/Unbounded-Regular.ttf
          weight: 400
        - asset: assets/fonts/Unbounded-Medium.ttf
          weight: 500
        - asset: assets/fonts/Unbounded-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Unbounded-Bold.ttf
          weight: 700
        - asset: assets/fonts/Unbounded-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Unbounded-Black.ttf
          weight: 900
